<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ritma</title>
    
    <meta name="description" content="Ritma: Produtividade no seu ritmo.">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#F2F6F9">
    <link rel="manifest" href="manifest.json">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css?v=3.0">
</head>
<body>

    <div class="app-layout">
        <header class="app-header">
            <div class="brand">
                <img src="icon.png" alt="Logo Ritma" class="logo-icon">
                <span class="logo-text">Ritma</span>
            </div>
            <div class="header-controls">
                <button id="btn-theme" class="icon-btn" aria-label="Tema"><i class="ph ph-moon"></i></button>
            </div>
        </header>

        <main id="app" class="container"></main>

        <nav class="bottom-nav">
            <button class="nav-item active" id="nav-home">
                <i class="ph-fill ph-house"></i>
                <span>Home</span>
            </button>
            <button class="nav-item" id="nav-stats">
                <i class="ph ph-chart-bar"></i>
                <span>Stats</span>
            </button>
            <button class="nav-item" id="btn-reset-nav">
                <i class="ph ph-arrows-counter-clockwise"></i>
                <span>Reset</span>
            </button>
        </nav>
    </div>

    <audio id="audio-focus" loop crossOrigin="anonymous"></audio>
    <audio id="audio-done" crossOrigin="anonymous">
        <source src="https://actions.google.com/sounds/v1/cartoon/pop.mp3" type="audio/mpeg">
    </audio>

    <template id="tpl-checkin">
        <div class="view-wrapper animate-enter centered-view">
            <div class="illustration-box">
                <i class="ph-fill ph-lightning" style="font-size: 64px; color: var(--accent-orange);"></i>
            </div>
            <h1 class="title-lg">Como está sua<br>energia hoje?</h1>
            <div class="energy-list" id="energy-options-container"></div>
        </div>
    </template>

    <template id="tpl-dashboard">
        <div class="view-wrapper animate-enter">
            <div class="header-section">
                <div>
                    <h2 class="greeting-title" id="greeting">Olá</h2>
                    <p class="date-subtitle" id="date-display">...</p>
                </div>
                <div class="user-avatar">
                    <i class="ph-fill ph-user"></i>
                </div>
            </div>

            <h3 class="section-label">Meu Ritmo Hoje</h3>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon-box theme-blue"><i class="ph-fill ph-battery-charging"></i></div>
                    <div><span class="stat-label">Energia</span><h4 class="stat-value" id="stat-energy">--</h4></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon-box theme-green"><i class="ph-fill ph-check-circle"></i></div>
                    <div><span class="stat-label">Tarefas</span><h4 class="stat-value" id="stat-tasks">0/0</h4></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon-box theme-purple"><i class="ph-fill ph-clock"></i></div>
                    <div><span class="stat-label">Foco Hoje</span><h4 class="stat-value" id="stat-focus-today">0m</h4></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon-box theme-orange"><i class="ph-fill ph-fire"></i></div>
                    <div><span class="stat-label">Streak</span><h4 class="stat-value" id="stat-streak">0</h4></div>
                </div>
            </div>

            <h3 class="section-label" style="margin-top: 24px;">Foco Atual</h3>
            <div id="hero-area"></div>

            <div class="new-task-wrapper">
                <div class="input-group">
                    <input type="text" id="new-task-input" placeholder="Nova tarefa..." autocomplete="off">
                    <input type="number" id="new-task-time" placeholder="25" min="1" max="120">
                    <button id="btn-add-task"><i class="ph-bold ph-plus"></i></button>
                </div>
            </div>

            <div id="queue-list" style="padding-bottom: 80px;"></div>

            <div id="empty-state" class="empty-state hidden">
                <h2>Tudo limpo! 🎉</h2>
                <p>Você dominou suas tarefas.</p>
            </div>
        </div>
    </template>

    <template id="tpl-stats">
        <div class="view-wrapper animate-enter">
            <h2 class="section-title-lg">Seu Progresso</h2>
            <div class="hero-card" style="background: var(--primary); margin-bottom: 24px;">
                <div style="opacity: 0.8; font-size: 14px; margin-bottom: 4px;">Foco Total Acumulado</div>
                <div style="font-size: 48px; font-weight: 800;" id="total-focus-time">0m</div>
                <div style="font-size: 12px; margin-top: 8px;"><i class="ph-fill ph-trend-up"></i> Continue assim!</div>
            </div>
            
            <h3 class="section-label">Atividade Semanal</h3>
            <div class="chart-container clay-card">
                <div class="chart-bars" id="chart-bars-container">
                    </div>
            </div>
            
            <h3 class="section-label">Por Energia</h3>
            <div class="clay-card stats-list" style="padding-bottom: 80px;">
                <div class="stat-row">
                    <div class="stat-icon-box theme-red"><i class="ph-fill ph-lightning"></i></div>
                    <div class="stat-info"><span>Alta</span><div class="progress-bg"><div class="progress-fill theme-bg-red" id="bar-alta" style="width: 0%"></div></div></div>
                    <span class="stat-number" id="count-alta">0</span>
                </div>
                <div class="stat-row">
                    <div class="stat-icon-box theme-orange"><i class="ph-fill ph-battery-medium"></i></div>
                    <div class="stat-info"><span>Moderada</span><div class="progress-bg"><div class="progress-fill theme-bg-orange" id="bar-moderada" style="width: 0%"></div></div></div>
                    <span class="stat-number" id="count-moderada">0</span>
                </div>
                <div class="stat-row">
                    <div class="stat-icon-box theme-green"><i class="ph-fill ph-battery-low"></i></div>
                    <div class="stat-info"><span>Baixa</span><div class="progress-bg"><div class="progress-fill theme-bg-green" id="bar-baixa" style="width: 0%"></div></div></div>
                    <span class="stat-number" id="count-baixa">0</span>
                </div>
            </div>
        </div>
    </template>

    <script src="script.js"></script>
    
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
</body>
</html>
